<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">CyberWolf cybersecurity learning path</title>
<desc id="desc">Ten connected stages from orientation and IT fundamentals through defensive security, ethical testing, specializations, and career portfolio.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c2638"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38f5d1"/><stop offset="1" stop-color="#36a9ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8bb8c9" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1400" height="700" rx="28" fill="url(#bg)"/>
<rect width="1400" height="700" rx="28" fill="url(#grid)"/>
