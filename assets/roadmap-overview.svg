<text x="64" y="112" fill="#f3f8fb" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">Your route into cybersecurity</text>
<text x="64" y="144" fill="#9ab5c4" font-family="Inter,Arial,sans-serif" font-size="16">Build foundations. Practise safely. Choose a track. Prove your skills.</text>
